<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName">FJ Red News Alert</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand"><span class="mark">!</span><div><h1 data-i18n="extName">FJ Red News Alert</h1><p id="status" class="status">Checking…</p></div></div>
    <div class="head-tools">
      <select id="language" class="lang-select" title="Language">
        <option value="auto" data-i18n="languageAuto">Auto</option>
        <option value="en" data-i18n="languageEn">EN</option>
        <option value="zh" data-i18n="languageZh">中文</option>
      </select>
      <span id="led" class="led"></span>
    </div>
  </header>

  <main>
    <section class="card">
      <label class="row">
        <span class="row-copy"><b data-i18n="enableMonitoring">Enable monitoring</b><small data-i18n="enableMonitoringDesc">Only works while FinancialJuice is open</small></span>
        <input id="enabled" class="switch" type="checkbox" checked>
      </label>
      <label class="row">
        <span class="row-copy"><b data-i18n="soundAlert">Sound alert</b><small data-i18n="soundAlertDesc">Play a three-tone chime for red headlines</small></span>
        <input id="sound" class="switch" type="checkbox" checked>
      </label>
      <label class="row">
        <span class="row-copy"><b data-i18n="systemNotification">System notification</b><small data-i18n="systemNotificationDesc">Show a macOS Notification Center banner</small></span>
        <input id="systemNotification" class="switch" type="checkbox" checked>
      </label>
      <label class="row">
        <span class="row-copy"><b data-i18n="pageStatus">Page status pill</b><small data-i18n="pageStatusDesc">Show monitoring state and red-news count in the bottom-right</small></span>
        <input id="showStatus" class="switch" type="checkbox" checked>
      </label>
    </section>

    <section class="card field">
      <label for="keywords"><b data-i18n="keywordFilter">Keyword filter</b><span class="hint" data-i18n="optional">optional</span></label>
      <input id="keywords" type="text" data-i18n-placeholder="keywordPlaceholder" placeholder="NQ, gold, FOMC, CPI; blank = all red news" autocomplete="off" spellcheck="false">
      <p class="help" id="keywordHelp"></p>
    </section>

    <div class="actions">
      <button id="test" class="primary" type="button" data-i18n="testAlert">Test alert</button>
      <button id="open" class="ghost" type="button" data-i18n="openSite">Open FinancialJuice</button>
    </div>

    <section class="last">
      <div class="last-head"><span data-i18n="latestAlert">Latest alert</span><span id="lastTime" class="last-time">—</span></div>
      <p id="last">No red headlines captured yet</p>
    </section>
  </main>

  <footer><span data-i18n="footer">Red headline → sound + system notification + page banner</span></footer>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
